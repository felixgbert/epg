name: EPG
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run grab --- --channels=custom.channels.xml --maxConnections=5 --output=guide.xml
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add guide.xml
          git commit -m "update guide" || exit 0
          git push
